# The family's shared crates, one workspace. Each joins `members` as it
# lands (agentplot/blueprints, design/capture/plan.md):
#   crates/weir-capture    the capture contract: its types and key rules,
#                          JSON in flight, recutils at rest, the sha256
#                          content hash and the excerpt cut: landed
#   crates/weir-signals    the signal, move and item records, and the
#                          inbox's layout
#   crates/weir-adapters   the folder drop, the meeting file and the
#                          signals-folder import
#   crates/weir-branch     the shared-branch write protocol
#   crates/weir-kinds      the kind format, with an elaboration kind's
#                          section: landed
#   crates/weir-cadence    five-field cron, caught up once
#   the conformance pack   contract lines in, the records a host must
#                          write from them out
#   crates/weir            the `weir` command line, a caller of the
#                          crates: landed, with `check`
[workspace]
resolver = "2"
members = ["crates/weir-capture", "crates/weir-kinds", "crates/weir"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
time = { version = "0.3", features = ["parsing", "formatting"] }
sha2 = "0.11"
# No feature that resolves a `$ref` by fetching it: a configuration is
# checked with nothing but its schema (core.1).
jsonschema = { version = "0.60", default-features = false }
tempfile = "3"
clap = { version = "4", features = ["derive"] }

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
large_enum_variant = "allow"
