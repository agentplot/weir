extends: capitalization
message: "Headings use sentence case: '%s'."
description: "Sentence case, as Google and Microsoft both set it, so a heading reads as a sentence and a proper noun stands out. Binds chapters only."
link: https://github.com/agentplot/blueprints/blob/main/books/research/2026-10-13-voice-and-style.md#4-what-the-documentation-guides-contribute
level: suggestion
scope: heading
match: $sentence
exceptions:
  - Part
  - Part A
  - Part B
  - Part C
  - JSON
  - TOML
  - SSH
  - OTLP
  - GitHub
  - Nix
  - moon
  - sluice
  - pinout
  - testledger
  - flywheel
  - millpond
  - weir
  - sounding
  - flume
  - headwater
  - eddy
  - crew
  - herdr
  - Flywheel
  - Claude
  - Claude Code
  - MCP
