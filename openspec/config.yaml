schema: spec-driven

context: |
  weir is the shared code of the agentplot tool family, one Rust
  workspace of public crates: the capture contract, the record formats,
  the shared-branch write protocol, the kind format, cadence, the
  built-in adapters and the conformance pack. millpond, headwater, eddy,
  sounding and flume build on it, and Flywheel later. No crate keeps
  state or knows which tool or host uses it. Cargo.toml lists the
  planned crates; each joins `members` as it lands.

  The design is in agentplot/blueprints (local:
  ~/Code/github_agentplot/blueprints/main): the capture design,
  design/capture/design.md, its plan, plan.md beside it, and weir's
  statement of invariants, design/weir/requirements.md. An artifact that
  rests on a clause cites it by bare number, (12), and never restates
  it. Where this repository and the design disagree, the design wins: a
  clause that no longer holds is changed in the statement first, never
  worked around here.

  Rules: weir's own are written into docs/architecture/ (core.md binds
  every change; an area's page beside it binds that area), with the
  decisions behind them in docs/adr/. Where weir has no rule of its own,
  the kit standard binds as its code profile says (.config/kit.toml),
  cited as kit:<id> (kit:testing.5): its rules are docs/architecture/ in
  afterthought/kit-standard (local:
  ~/Code/github_afterthought/kit-standard/main/docs/architecture/).

  Stack: Rust in a cargo workspace; devenv for the shell, moon (through
  proto) for the checks, treefmt for formatting and Vale for prose.
  Every tool runs through the shell, one command at a time:
  devenv shell -- <command>. Each check is a moon task tagged with its
  layer; CLAUDE.md names the layers, and check-fast (format and the
  README's prose) runs in seconds. sluice gates every merge into a bolt
  and onto main on the layers .config/sluice.toml requires. treefmt
  fails on a tracked file no formatter claims and no exclude names
  (treefmt.nix).

  Commits: stage by pathspec and commit the paths you wrote, git add
  <paths>, then git commit -m "<subject>" -- <paths>; never -a, never
  add . (kit:agents.3). Conventional Commits subjects, scoped to the part
  of the tree touched; the commit-msg hook refuses any other.

rules:
  specs:
    - "A spec changes only through a delta in the change that builds it, and each scenario is one a moon task proves (kit:specs.3, kit:testing.5). A scenario no existing check proves is a check this change adds, in its tasks; never a step done by hand."
  design:
    - "Cite by id the rules in docs/architecture/ that this design relies on, and name each page of docs/architecture/ whose area the change touches. Where the design departs from a rule, name the rule and say why."
    - "Where weir has no rule of its own for the area, cite the kit standard's rules the same way, as kit:<id>; a departure from one is recorded as an ADR in docs/adr/ naming the rule (kit:kit.4)."
    - "Cite by number the clauses of the statement (design/weir/requirements.md in agentplot/blueprints) the design satisfies."
    - "The design holds no proof list of any name, no *Proof in dev*, no *Proof on real work*: a change is proved by weir's checks, named task by task (kit:testing.5)."
  tasks:
    - "Each task says what must be true and names the moon task that proves it, run as `devenv shell -- moon run <project>:<task>` (kit:specs.3). No task is a step done by hand, a deploy or work after the landing."
    - "A task that adds a crate adds it to the workspace's `members` and as a moon project of its own in .moon/workspace.yml, with a task per check, format, lint, typecheck and test, each tagged with its layer and declaring its inputs, /devenv.nix, /devenv.lock and /.prototools among them (kit:testing.1, kit:testing.3)."
    - "A task that adds a file type has treefmt.nix claim it with a formatter or name it in an exclude, with its reason, in the same task."
    - "The last task runs the checks of the moon projects the change touches, never the whole workspace, which sluice runs at the merge."

operations:
  apply:
    guidance:
      - "Tick a task only once the check it names passes, run as the task names it."
      - "Where a task leaves a detail open, decide it the way a careful engineer would from docs/architecture (where weir has no rule, the kit standard's), openspec/specs, the statement in agentplot/blueprints, CLAUDE.md and the code, in that order, hold similar things to the same rule, and name each choice in your summary. An open detail is not a reason to pause."
      - "Pause only when the same check still fails after two attempts, or when passing would mean changing a rule in docs/architecture, a spec under openspec/specs or a clause of the statement that the task does not tell you to change."
