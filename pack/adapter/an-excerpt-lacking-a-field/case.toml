# Own excerpts lacking their text or a field, or of a nature not of the
# five, each breaking 7; one whose lists are empty keeps it.
satisfies = [7]
exited_ok = true
passes = false

[[breach]]
line = 1
clause = 7
reason_holds = "`excerpt.text` is empty"

[[breach]]
line = 2
clause = 7
reason_holds = "`excerpt.position` is missing"

[[breach]]
line = 3
clause = 7
reason_holds = "`opinion`"
