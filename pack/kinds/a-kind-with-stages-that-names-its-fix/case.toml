# A kind with stages naming the kind its fixes run as and how many it
# runs: refused naming each, since only a kind that lands with no stages
# names them (52, 57 as amended at blueprints 31f9f1c).
satisfies = [52, 57]
declaration = """
[kinds.bump]
lands = true
fix = "fix"
max_fixes = 2

[[kinds.bump.stages]]
name = "code"
prompt = "prompts/code.md"
deliverables = ["commits"]
"""

[[expect.refused]]
field = "kinds.bump.fix"
reason_holds = "only a kind that lands with no stages names"

[[expect.refused]]
field = "kinds.bump.max_fixes"
reason_holds = "only a kind that lands with no stages names"
