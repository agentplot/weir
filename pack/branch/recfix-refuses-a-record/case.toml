# A write adding a record file holding a line that is no field of a
# record: recfix refuses it, the write is refused naming the file, and no
# commit is made.
satisfies = [46]
remote = true
stale_after_seconds = 60

[start]
"inbox/captures/release/acme/v0/capture.rec" = """
format: weir-capture/1
key: release/acme/v0
source: releases
"""

[[write]]
who = "curation@two"
what = "move release/acme/v0#1"

[write.add]
path = "inbox/moves/moves.rec"
text = """
format: weir-move/1
signal: release/acme/v0#1
this line is no field
"""

[[expect.write]]
outcome = "refused"
tries = 1
reason_holds = "inbox/moves/moves.rec"

[expect.tip]
"inbox/captures/release/acme/v0/capture.rec" = """
format: weir-capture/1
key: release/acme/v0
source: releases
"""
