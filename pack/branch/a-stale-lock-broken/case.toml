# A lock taken two minutes ago stands in the writer's git directory, and
# the writers' stale age is a minute: the writer breaks it, takes it, lands
# its write, and names the holder of the lock it broke.
satisfies = [49]
remote = true
stale_after_seconds = 60

[lock]
holder = "curation@one"
age_seconds = 120

[start]
"inbox/captures/release/acme/v0/capture.rec" = """
format: weir-capture/1
key: release/acme/v0
source: releases
"""

[[write]]
who = "host@one"
what = "take release/acme/v1"

[write.add]
path = "inbox/captures/release/acme/v1/capture.rec"
text = """
format: weir-capture/1
key: release/acme/v1
source: releases
"""

[[expect.write]]
outcome = "landed"
tries = 1
broke = "curation@one"

[[expect.commit]]
what = "take release/acme/v1"
asked_by = "host@one"

[expect.tip]
"inbox/captures/release/acme/v0/capture.rec" = """
format: weir-capture/1
key: release/acme/v0
source: releases
"""
"inbox/captures/release/acme/v1/capture.rec" = """
format: weir-capture/1
key: release/acme/v1
source: releases
"""
