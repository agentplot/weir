# A release adapter's run offers one capture whose own excerpt runs to
# forty kibibytes, the notes whole as its raw material (S1). The host
# writes one capture and its own signal in one write, cut at a line
# within the limit and closed with the line naming what was left out,
# never unread; banks the notes and the whole excerpt on its machine
# before the capture, its pointer naming them; and records the run
# complete, its cursor kept. Any host given these lines writes these
# records (24).
satisfies = [6, 8, 9, 11, 16, 17, 18, 19, 20, 21, 22, 23, 24]
limit = 8192

[[step]]
run = "adapter.sh"
lines = "lines.jsonl"
raw = "raw"
taken = ["release/acme/1.0"]
held = 0
listed = 1
cursor = "2026-10-17T04:30:05Z"
complete = true
