$schema: 'https://moonrepo.dev/schemas/project.json'

# The workspace as a whole: a candidate is held to what the commit hooks
# hold a commit to.
tasks:
  # Every formatter treefmt.nix configures, writing nothing it would change
  # and keeping no cache outside the tree. It reads every tracked file: one
  # that no formatter claims and no exclude names fails it.
  format:
    command: 'treefmt --ci'
    inputs: ['/**/*', '!/.devenv/**', '!/.moon/cache/**']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # rustc, cargo, clippy-driver and rustfmt are the build .prototools pins,
  # on whichever host runs the gate (core.40). It reads the tools it checks
  # from outside the tree, so it never replays.
  toolchain:
    command: 'sh check-toolchain.sh'
    inputs: ['/check-toolchain.sh', '/rust-toolchain.toml', '/.prototools', '/devenv.nix', '/devenv.lock']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true, cache: false}
  # The README's prose, through Vale (.vale.ini, styles/Weir).
  prose:
    command: 'vale README.md'
    inputs: ['/README.md', '/.vale.ini', '/styles/**/*']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  # A new place's first commit through the shared hooks, made before anyone
  # enters its shell (devenv.nix, `hooks`).
  hooks:
    command: 'hooks'
    inputs: ['/devenv.nix', '/devenv.yaml', '/devenv.lock', '/treefmt.nix', '/.versionrc']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
