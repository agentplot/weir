[package]
name = "weir"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The family's weir command line: weir check reads a declaration of kinds, weir capture and weir import signals run the built-in adapters and the signals-folder import, and weir conform runs a host against the pack's host cases (statement section 9; C.6, C.7)."

[[bin]]
name = "weir"
path = "src/main.rs"

[dependencies]
weir-kinds = { path = "../weir-kinds" }
clap.workspace = true
weir-capture = { path = "../weir-capture" }
weir-adapters = { path = "../weir-adapters" }
weir-pack = { path = "../weir-pack" }
weir-signals = { path = "../weir-signals" }
weir-branch = { path = "../weir-branch" }
time.workspace = true
tempfile.workspace = true

[lints]
workspace = true
