$schema: 'https://moonrepo.dev/schemas/project.json'

# The kind format's reader: its format, lint, typecheck and test, one task
# per check (core.39). Each names every file it reads, the toolchain's
# among them, so a replayed pass stands for a run on the same inputs
# (kit:testing.3).
language: 'rust'

tasks:
  format:
    command: 'cargo fmt -p weir-kinds --check'
    inputs: &inputs ['/crates/weir-kinds/**/*', '/Cargo.toml', '/Cargo.lock', '/rust-toolchain.toml', '/devenv.nix', '/devenv.lock', '/.prototools']
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  lint:
    command: 'cargo clippy -p weir-kinds --all-targets -- -D warnings'
    inputs: *inputs
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  typecheck:
    command: 'cargo check -p weir-kinds --all-targets'
    inputs: *inputs
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
  test:
    command: 'cargo test -p weir-kinds'
    inputs: *inputs
    tags: [check-fast]
    options: {runFromWorkspaceRoot: true}
