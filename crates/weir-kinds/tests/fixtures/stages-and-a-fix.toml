# A kind with stages naming the kind its fixes run as and how many it
# runs, one that lands and one that does not: each field refused, since
# only a kind that lands with no stages names them (57 as amended at
# blueprints 31f9f1c).
[kinds.bump]
lands = true
fix = "fix"
max_fixes = 2

[[kinds.bump.stages]]
name = "code"
prompt = "prompts/code.md"
deliverables = ["commits"]

[kinds.tidy]
fix = "fix"
max_fixes = 2

[[kinds.tidy.stages]]
name = "code"
prompt = "prompts/code.md"
deliverables = ["commits"]
