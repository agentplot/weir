# A kind's fix or its bound of the wrong shape, one kind that lands with
# no stages for each: a fix that is not a string, or a string that names
# no kind, and a bound that is not an integer of at least 0, each refused
# naming the field (57 and C.4 as amended at blueprints 31f9f1c; core.42).
[kinds.fix-number]
lands = true
stages = []
fix = 3

[kinds.fix-empty]
lands = true
stages = []
fix = ""

[kinds.fix-space]
lands = true
stages = []
fix = "a b"

[kinds.fix-path]
lands = true
stages = []
fix = "../fix"

[kinds.fix-version-zero]
lands = true
stages = []
fix = "fix@0"

[kinds.bound-negative]
lands = true
stages = []
max_fixes = -1

[kinds.bound-string]
lands = true
stages = []
max_fixes = "2"

[kinds.bound-fraction]
lands = true
stages = []
max_fixes = 1.5
