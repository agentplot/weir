# An elaboration kind: stages for whoever runs places, and a section for
# whoever runs elaborations (55, S11).
[kinds.writeback]
lands = true

[[kinds.writeback.stages]]
name = "write"
prompt = "prompts/writeback.md"
deliverables = ["committed:books/conclusion.md"]

[kinds.writeback.elaboration]
inputs = ["books/outline.md"]
conclusion = ["what changes"]
ending = "self-closing"
transcripts = false
lands = ["books/", "design/"]
