# moon runs weir's checks. Each check is tagged with its layer, which a
# branch's policy will require by tag:
#   check-fast    format, the README's prose, a new place's first commit
#                 through the hooks, the Rust toolchain's pin, and each
#                 crate's format, lint, typecheck and tests: seconds
# Each crate is a project of its own, holding its own checks (core.39); the
# root holds what spans the tree. A task whose inputs are identical to a run
# that passed on this host, in any worktree, replays from .moon/cache/outputs
# (a link into the git common dir, made by devenv.nix) instead of running
# again.
$schema: 'https://moonrepo.dev/schemas/workspace.json'

projects:
  adapters: 'crates/weir-adapters'
  branch: 'crates/weir-branch'
  cadence: 'crates/weir-cadence'
  capture: 'crates/weir-capture'
  kinds: 'crates/weir-kinds'
  signals: 'crates/weir-signals'
  weir: 'crates/weir'
  root: '.'

# --affected compares against the merge-base with main.
vcs:
  client: 'git'
  defaultBranch: 'main'

telemetry: false
